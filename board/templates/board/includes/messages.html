{% if messages %}
    <div class="message-container">
        {% for message in messages %}
            <div
                class="alert alert-{{ message.tags|default:'info' }}"
                role="alert"
            >
                <span>{{ message }}</span>

                <button
                    type="button"
                    class="alert-close"
                    aria-label="알림 닫기"
                >
                    ×
                </button>
            </div>
        {% endfor %}
    </div>
{% endif %}
