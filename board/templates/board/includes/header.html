{% load static %}

<header class="site-header">
    <div class="header-inner">
        <a href="{% url 'board:post_list' %}" class="brand">
            <img
                src="{% static 'board/images/logo.svg' %}"
                alt="자료실 로고"
                class="brand-logo"
            >

            <div>
                <strong class="brand-title">Django 자료실</strong>
                <span class="brand-subtitle">
                    사내 문서 및 교육 자료 공유
                </span>
            </div>
        </a>

        <nav class="main-nav" aria-label="주 메뉴">
            <a href="{% url 'board:post_list' %}">
                자료 목록
            </a>

            {% if request.user.is_authenticated %}
                <a href="{% url 'board:post_add' %}">
                    자료 등록
                </a>

                <span class="user-name">
                    {{ request.user.username }}님
                </span>

                <form
                    method="post"
                    action="{% url 'board:signout' %}"
                    class="inline-form"
                >
                    {% csrf_token %}
                    <button type="submit" class="nav-button">
                        로그아웃
                    </button>
                </form>
            {% else %}
                <a href="{% url 'board:signin' %}">
                    로그인
                </a>

                <a href="{% url 'board:signup' %}">
                    회원가입
                </a>
            {% endif %}
        </nav>

        <button
            type="button"
            id="mobile-menu-button"
            class="mobile-menu-button"
            aria-label="메뉴 열기"
            aria-expanded="false"
        >
            ☰
        </button>
    </div>
</header>
